# LiteLLM Proxy Configuration for Local Models (LM Studio + Ollama)
# This config routes requests to LM Studio and Ollama running on your MacBook Pro

model_list:
  # LM STUDIO MODELS
  # These connect to LM Studio running at localhost:1234 on your Mac


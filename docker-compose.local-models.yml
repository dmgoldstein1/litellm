# Docker Compose configuration for LiteLLM Proxy with local LM Studio and Ollama models
# This configuration connects to LM Studio and Ollama running on your MacBook Pro host

version: '3.8'

services:
  litellm:
    build:
      context: .
      args:
        target: runtime
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-proxy
    
    # Mount the custom config file for local models
    volumes:
      - ./config.local-models.yaml:/app/config.yaml
    
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
    
    ports:
      - "4000:4000"  # LiteLLM Proxy server
    
    environment:
      # Use host.docker.internal to reach services on the Mac host
      # This allows Docker containers to communicate with the host
      LM_STUDIO_API_BASE: "http://host.docker.internal:1234/v1"
      OLLAMA_API_BASE: "http://host.docker.internal:11434"
    
    # Allow container to communicate with host services
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 http://localhost:4000/health/liveliness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
